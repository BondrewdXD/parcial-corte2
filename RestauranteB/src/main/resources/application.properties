spring.application.name=AgendaManager
#Puerto
server.port=9000
# spring.jpa.hibernate.ddl-auto: specifies the strategy for creating and dropping database tables
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql=true
spring.datasource.url = jdbc:mysql://localhost:3306/restaurante
# spring.datasource.username: specifies the username for the PostgreSQL database connection
spring.datasource.username = root
spring.datasource.password = 
# Configuraci n de Swagger con Springdoc OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
